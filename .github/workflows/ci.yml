name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test images
        run: |
          python -c "
          import pandas as pd, cv2, numpy as np, os
          df = pd.read_csv('data/processed/manifest.csv')
          paths = set(df['image_path'].dropna().tolist() + df['left_mask_path'].dropna().tolist() + df['right_mask_path'].dropna().tolist())
          for p in paths:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              if not os.path.exists(p):
                  cv2.imwrite(p, np.zeros((100, 100), dtype=np.uint8))
          "
          
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=tb_cxr